<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akses Ditolak - Waste2Worth</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    .denied-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
      padding: 20px;
    }

    .denied-card {
      background: white;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .denied-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: #ffebee;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: #f44336;
      animation: pulse 2s ease-in-out infinite;
    }

    .denied-card h1 {
      font-size: 32px;
      font-weight: 800;
      color: #212121;
      margin-bottom: 12px;
    }

    .denied-card p {
      font-size: 15px;
      color: #616161;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .denied-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .denied-info {
      margin-top: 30px;
      padding: 16px;
      background: #fff3e0;
      border-radius: 12px;
      font-size: 13px;
      color: #f57c00;
      text-align: left;
    }

    .denied-info strong {
      display: block;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="denied-container">
    <div class="denied-card">
      <div class="denied-icon">
        <i class="fas fa-lock"></i>
      </div>

      <h1>Akses Ditolak</h1>
      <p>
        Maaf, Anda tidak memiliki izin untuk mengakses halaman ini.
        Halaman ini hanya dapat diakses oleh peran tertentu.
      </p>

      <div class="denied-actions">
        <a href="javascript:history.back()" class="btn btn-outline">
          <i class="fas fa-arrow-left"></i> Kembali
        </a>
        <a href="../index.html" class="btn btn-primary">
          <i class="fas fa-home"></i> Ke Beranda
        </a>
      </div>

      <div class="denied-info" id="deniedInfo">
        <strong><i class="fas fa-info-circle"></i> Informasi:</strong>
        <span id="infoText">Silakan login dengan akun yang sesuai.</span>
      </div>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/akses-ditolak.js"></script>
</body>
</html>
